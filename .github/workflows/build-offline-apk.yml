name: Build offline BitChord (dev)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Apply offline patch
        run: |
          echo '' | base64 -d | gunzip > offline.patch
          git apply --whitespace=nowarn offline.patch

      - name: Build dev debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDevDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bitchord-offline-apk
          path: app/build/outputs/apk/dev/debug/*.apk
